<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Судоку 9×9</title>

  <link rel="stylesheet" href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css">
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.toolbar.min.js"></script>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>   СУДОКУ</h1>
    <div class="scoreboard" role="status" aria-live="polite">
      <span>ПОМИЛКИ: <strong id="error-count">0</strong> / 3</span>
    </div>
    <button id="new-game-btn">НОВА ГРА</button>
  </header>

  <main>
    <section aria-label="Ігрове поле">
      <div id="pivot-container"></div>
      <div id="sudoku-board"></div>
      <div id="game-message" class="hidden" role="alert"></div>
    </section>

    <aside aria-label="Панель керування"> 
      <p id="selected-label">Оберіть клітинку</p>

      <div class="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
      </div>

      <button id="clear-btn">ОЧИСТИТИ</button>

      <label class="notes-label">
        <input type="checkbox" id="notes-mode">
        <span class="toggle-track"></span>
        Режим нотаток
      </label>

      <ul class="legend">
        <li><span class="dot given"></span> Дано</li>
        <li><span class="dot user-ok"></span> Введено</li>
        <li><span class="dot user-err"></span> Помилка</li>
      </ul>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
